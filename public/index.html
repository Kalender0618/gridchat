<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesajlaşma</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#262b36; --text:#e7eaf0; --muted:#8a93a6; --accent:#4f7cff; --mine:#2d4fb3; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; }
  .hidden { display:none !important; }
  button { font:inherit; cursor:pointer; border:none; border-radius:8px; padding:9px 14px; background:var(--accent); color:#fff; }
  button.secondary { background:#2a2f3b; }
  button.danger { background:#c0392b; }
  input { font:inherit; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:#0f1115; color:var(--text); }

  /* giriş ekranı */
  #auth { display:flex; align-items:center; justify-content:center; height:100%; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; width:340px; display:flex; flex-direction:column; gap:12px; }
  .card h1 { margin:0 0 4px; font-size:20px; }
  .tabs { display:flex; gap:6px; }
  .tabs button { flex:1; background:#2a2f3b; }
  .tabs button.active { background:var(--accent); }
  .error { color:#ff7b7b; font-size:14px; min-height:18px; }

  /* uygulama */
  #app { display:flex; flex-direction:column; height:100%; }
  header { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header .who { color:var(--muted); font-size:14px; }
  header .actions { display:flex; gap:8px; align-items:center; }
  main { flex:1; display:flex; min-height:0; }
  #screenArea { flex:1; display:flex; flex-direction:column; min-width:0; background:#000; }
  #screenArea.hidden { display:none; }
  #screenBar { padding:8px 12px; background:var(--panel); display:flex; gap:8px; align-items:center; font-size:14px; flex-wrap:wrap; }
  #screenBar select { background:#0f1115; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px; }
  #videos { flex:1; display:flex; flex-wrap:wrap; gap:8px; padding:8px; overflow:auto; align-content:flex-start; }
  #videos video { width:100%; max-height:70vh; background:#111; border-radius:8px; }
  #chat { width:380px; display:flex; flex-direction:column; border-left:1px solid var(--line); min-width:0; }
  #chat.full { flex:1; width:auto; }
  #messages { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:8px 11px; border-radius:12px; background:#222733; align-self:flex-start; word-wrap:break-word; }
  .msg.mine { background:var(--mine); align-self:flex-end; }
  .msg .name { font-size:12px; color:var(--muted); margin-bottom:3px; }
  .msg.mine .name { color:#c9d6ff; }
  .msg img { max-width:240px; max-height:240px; border-radius:8px; display:block; margin-top:4px; cursor:pointer; }
  .msg .text { white-space:pre-wrap; }
  .msg .time { font-size:11px; color:#aab3c5; margin-top:3px; text-align:right; }
  #composer { display:flex; gap:6px; padding:10px; border-top:1px solid var(--line); background:var(--panel); align-items:center; }
  #composer input[type=text] { flex:1; min-width:0; }
  #composer label.attach { background:#2a2f3b; border-radius:8px; padding:9px 11px; cursor:pointer; }
  #composer input[type=file] { display:none; }
  #preview { font-size:13px; color:var(--muted); padding:0 12px 6px; }
  @media (max-width: 760px) { #chat { width:100%; } main { flex-direction:column; } }
</style>
</head>
<body>

<!-- Giriş / Kayıt -->
<div id="auth">
  <div class="card">
    <h1>Mesajlaşma</h1>
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">Giriş yap</button>
      <button id="tabRegister" class="secondary" onclick="switchTab('register')">Hesap oluştur</button>
    </div>
    <input id="username" placeholder="Kullanıcı adı (3-20, harf/rakam/_)" autocomplete="username">
    <input id="password" type="password" placeholder="Şifre (en az 6 karakter)" autocomplete="current-password">
    <button id="authBtn" onclick="submitAuth()">Giriş yap</button>
    <div id="authError" class="error"></div>
  </div>
</div>

<!-- Uygulama -->
<div id="app" class="hidden">
  <header>
    <div>
      <strong>Sohbet</strong>
      <span class="who" id="whoami"></span>
    </div>
    <div class="actions">
      <span class="who" id="online"></span>
      <button id="shareBtn" class="secondary" onclick="toggleShare()">Ekranı paylaş</button>
      <button class="secondary" onclick="logout()">Çıkış</button>
    </div>
  </header>

  <main>
    <section id="screenArea" class="hidden">
      <div id="screenBar">
        <span id="screenStatus">Ekran paylaşımı yok</span>
        <select id="sharerSelect" onchange="joinSelected()"></select>
        <button class="secondary" onclick="leaveViewing()">İzlemeyi bırak</button>
      </div>
      <div id="videos"></div>
    </section>

    <section id="chat">
      <div id="messages"></div>
      <div id="preview" class="hidden"></div>
      <form id="composer" onsubmit="sendMessage(event)">
        <label class="attach" title="Fotoğraf ekle">
          📷<input type="file" id="photo" accept="image/png,image/jpeg,image/gif,image/webp" onchange="onPhotoPicked(event)">
        </label>
        <input type="text" id="text" placeholder="Mesaj yaz..." maxlength="2000" autocomplete="off">
        <button type="submit">Gönder</button>
      </form>
    </section>
  </main>
</div>

<script>
const RTC_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
let token = localStorage.getItem('token');
let me = null;
let socket = null;
let pendingImage = null;
let localStream = null;
const sharerPeers = new Map();   // viewerId -> RTCPeerConnection (paylaşan tarafta)
let viewerPc = null;             // izleyici tarafındaki bağlantı
let watchingId = null;
const sharers = new Map();       // socketId -> username

const $ = id => document.getElementById(id);

function switchTab(tab) {
  const login = tab === 'login';
  $('tabLogin').className = login ? 'active' : 'secondary';
  $('tabRegister').className = login ? 'secondary' : 'active';
  $('authBtn').textContent = login ? 'Giriş yap' : 'Hesap oluştur';
  $('authError').textContent = '';
  $('authBtn').dataset.mode = tab;
}

async function api(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: { ...(opts.body && !(opts.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {}),
               ...(token ? { Authorization: 'Bearer ' + token } : {}) }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Bir hata oluştu');
  return data;
}

async function submitAuth() {
  const mode = $('authBtn').dataset.mode || 'login';
  $('authError').textContent = '';
  try {
    const data = await api('/api/' + (mode === 'login' ? 'login' : 'register'), {
      method: 'POST',
      body: JSON.stringify({ username: $('username').value, password: $('password').value })
    });
    token = data.token;
    localStorage.setItem('token', token);
    start(data.user);
  } catch (e) {
    $('authError').textContent = e.message;
  }
}

async function logout() {
  try { await api('/api/logout', { method: 'POST' }); } catch (e) {}
  localStorage.removeItem('token');
  token = null;
  if (socket) socket.disconnect();
  location.reload();
}

function start(user) {
  me = user;
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('whoami').textContent = '· ' + user.username;
  connectSocket();
  loadHistory();
}

async function loadHistory() {
  const { messages } = await api('/api/messages');
  $('messages').innerHTML = '';
  messages.forEach(appendMessage);
}

function connectSocket() {
  socket = io({ auth: { token } });
  socket.on('connect_error', () => { logout(); });
  socket.on('message', appendMessage);
  socket.on('presence', n => { $('online').textContent = n + ' çevrimiçi'; });
  socket.on('sharers', list => { sharers.clear(); list.forEach(s => sharers.set(s.socketId, s.username)); renderSharers(); });
  socket.on('screen:started', ({ socketId, username }) => { sharers.set(socketId, username); renderSharers(); });
  socket.on('screen:stopped', ({ socketId }) => {
    sharers.delete(socketId);
    renderSharers();
    if (watchingId === socketId) leaveViewing();
  });
  socket.on('screen:viewer', onViewerJoined);
  socket.on('webrtc:signal', onSignal);
}

function appendMessage(m) {
  const mine = me && m.userId === me.id;
  const div = document.createElement('div');
  div.className = 'msg' + (mine ? ' mine' : '');
  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = m.from;
  div.appendChild(name);
  if (m.text) {
    const t = document.createElement('div');
    t.className = 'text';
    t.textContent = m.text;
    div.appendChild(t);
  }
  if (m.image) {
    const img = document.createElement('img');
    img.src = m.image;
    img.alt = 'fotoğraf';
    img.onclick = () => window.open(m.image, '_blank');
    div.appendChild(img);
  }
  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = new Date(m.createdAt).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  div.appendChild(time);
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
}

async function onPhotoPicked(e) {
  const file = e.target.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('photo', file);
  try {
    const { url } = await api('/api/upload', { method: 'POST', body: form });
    pendingImage = url;
    $('preview').textContent = '📎 Fotoğraf hazır: ' + file.name + ' (göndermek için Gönder\'e bas)';
    $('preview').classList.remove('hidden');
  } catch (err) {
    alert(err.message);
  }
  e.target.value = '';
}

function sendMessage(e) {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text && !pendingImage) return;
  socket.emit('message', { text, image: pendingImage }, res => {
    if (res && res.error) alert(res.error);
  });
  $('text').value = '';
  pendingImage = null;
  $('preview').classList.add('hidden');
}

// ---------- Ekran paylaşımı ----------
function renderSharers() {
  const select = $('sharerSelect');
  const current = select.value;
  select.innerHTML = '<option value="">Paylaşımı seç...</option>';
  sharers.forEach((username, id) => {
    if (id === socket.id) return;
    const o = document.createElement('option');
    o.value = id;
    o.textContent = username + ' ekranı';
    select.appendChild(o);
  });
  if ([...sharers.keys()].includes(current)) select.value = current;
  const mineSharing = sharers.has(socket.id);
  $('shareBtn').textContent = mineSharing ? 'Paylaşımı durdur' : 'Ekranı paylaş';
  $('shareBtn').className = mineSharing ? 'danger' : 'secondary';
  const anyone = sharers.size > 0 || mineSharing;
  $('screenArea').classList.toggle('hidden', !anyone);
  $('chat').classList.toggle('full', !anyone);
  $('screenStatus').textContent = mineSharing ? 'Ekranınız paylaşılıyor' : (sharers.size ? 'Bir ekran paylaşımı var' : 'Ekran paylaşımı yok');
}

function joinSelected() {
  const id = $('sharerSelect').value;
  if (!id) return;
  watchingId = id;
  socket.emit('screen:join', { to: id });
}

function leaveViewing() {
  watchingId = null;
  if (viewerPc) { viewerPc.close(); viewerPc = null; }
  $('videos').innerHTML = '';
  $('sharerSelect').value = '';
}

async function toggleShare() {
  if (sharers.has(socket.id)) return stopSharing();
  try {
    localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
  } catch (e) {
    return alert('Ekran paylaşımı başlatılamadı: ' + e.message);
  }
  localStream.getVideoTracks()[0].onended = stopSharing;
  sharers.set(socket.id, me.username);
  socket.emit('screen:start');
  renderSharers();
  const local = document.createElement('video');
  local.muted = true; local.autoplay = true; local.playsInline = true;
  local.srcObject = localStream;
  local.dataset.local = '1';
  $('videos').innerHTML = '';
  $('videos').appendChild(local);
}

function stopSharing() {
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  localStream = null;
  sharerPeers.forEach(pc => pc.close());
  sharerPeers.clear();
  sharers.delete(socket.id);
  socket.emit('screen:stop');
  $('videos').innerHTML = '';
  renderSharers();
}

// Bir izleyici katıldığında paylaşan taraf ona bağlantı teklifi gönderir
async function onViewerJoined({ viewerId }) {
  if (!localStream) return;
  const pc = new RTCPeerConnection(RTC_CONFIG);
  sharerPeers.set(viewerId, pc);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.onicecandidate = e => {
    if (e.candidate) socket.emit('webrtc:signal', { to: viewerId, data: { candidate: e.candidate } });
  };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('webrtc:signal', { to: viewerId, data: { sdp: pc.localDescription } });
}

async function onSignal({ from, data }) {
  if (sharers.has(socket.id) && sharerPeers.has(from)) {
    // paylaşan taraf: izleyicinin answer / ICE mesajları
    const pc = sharerPeers.get(from);
    if (data.sdp) await pc.setRemoteDescription(data.sdp);
    if (data.candidate) await pc.addIceCandidate(data.candidate);
    return;
  }
  // izleyici taraf: paylaşanın offer / ICE mesajları
  if (from !== watchingId) return;
  if (!viewerPc) {
    viewerPc = new RTCPeerConnection(RTC_CONFIG);
    viewerPc.ontrack = e => {
      $('videos').innerHTML = '';
      const v = document.createElement('video');
      v.autoplay = true; v.playsInline = true; v.controls = true;
      v.srcObject = e.streams[0];
      $('videos').appendChild(v);
    };
    viewerPc.onicecandidate = e => {
      if (e.candidate) socket.emit('webrtc:signal', { to: from, data: { candidate: e.candidate } });
    };
  }
  if (data.sdp) {
    await viewerPc.setRemoteDescription(data.sdp);
    if (data.sdp.type === 'offer') {
      const answer = await viewerPc.createAnswer();
      await viewerPc.setLocalDescription(answer);
      socket.emit('webrtc:signal', { to: from, data: { sdp: viewerPc.localDescription } });
    }
  }
  if (data.candidate) await viewerPc.addIceCandidate(data.candidate);
}

// Sayfa açılışında oturum kontrolü
(async () => {
  if (!token) return;
  try {
    const { user } = await api('/api/me');
    start(user);
  } catch (e) {
    localStorage.removeItem('token');
    token = null;
  }
  switchTab('login');
})();
</script>
</body>
</html>
